aid: insightera
name: InsightEra
description: >-
  InsightEra Co., Ltd. is a Bangkok-based marketing technology and data
  intelligence company that builds ready-to-use online marketing tools from
  social network data. Its platform spans social research (social listening and
  competitor analytics), social management (omni-channel management and
  chatbots), social data and analytics (Customer Data Platform and CRM), and
  social campaigns (campaign targeting and analytics), alongside a Thai NLP
  service and a generative enterprise AI platform. InsightEra positions its
  "Intelligence Model" as an ecosystem that connects external intelligence
  (market, customers, competitors, society) with internal organizational data so
  brands can turn insight into interaction and action. The company was surfaced
  as a portfolio lead of lightspeed-venture-partners and added to the API
  Evangelist network. InsightEra publishes one public developer surface: the
  NLP Platform API (branded "ELI") at nlp.insightera.co.th, a RESTful Thai
  natural-language-processing service documented with a live Swagger 2.0
  contract covering tokenization, part-of-speech tagging, named entity
  recognition, sentiment analysis, spell correction, OCR, address and email
  extraction, clustering and a trainable custom text-classification model
  service. The commercial SaaS products (DOM social listening, CENT
  omni-channel management, Alice chatbot, Brian competitor analytics, 1Palette
  customer analytics and GenA generative enterprise AI) run on customer-only
  backends with no published contract.
