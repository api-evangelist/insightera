apis:
- name: InsightEra NLP Platform API
  description: >-
    RESTful Thai natural-language-processing service, branded "ELI" in
    InsightEra's own showcase, published with a live Swagger 2.0 contract at
    nlp.insightera.co.th/docs/v1.0/. Twenty-three operations across two
    resource groups: an `nlp` group of stateless text services (Thai text
    tokenization, part-of-speech tagging, named entity recognition, sentiment
    analysis, spell correction, text cleaning, clustering, common-phrase
    detection, country detection, datetime parsing, address extraction, email
    extraction, similar-word lookup, OCR and a QA endpoint marked coming soon)
    and a `classification` group that trains, retrains, inspects, renames and
    deletes customer-owned text-classification models and runs predictions
    against them. Every operation authenticates with a required `token` query
    parameter.
  humanURL: https://nlp.insightera.co.th/docs/v1.0/
  baseURL: https://nlp.insightera.co.th/api
