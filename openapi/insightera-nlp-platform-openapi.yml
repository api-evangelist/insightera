        '500':
          description: Internal Server Error
          schema:
            type: string
  /nlp/classification/token:
    get:
      description: 'Retrieve all models belong to a given token:

        * Model name

        * Model status

        * Created date

        * Number of sample in each class'
      produces:
      - application/json
      tags:
      - classification
      summary: Model Details by Token
      parameters:
