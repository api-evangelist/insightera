        '400':
          description: Bad Request
          schema:
            type: string
        '401':
          description: Unauthorized
          schema:
            type: string
        '408':
          description: Request Timeout
          schema:
            type: string
        '500':
          description: Internal Server Error
          schema:
            type: string
