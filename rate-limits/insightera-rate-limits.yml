note: >-
  InsightEra documents no numeric rate limits, but the live API demonstrably enforces a per-token,
  per-service QUOTA — so this is not an absence of limiting, it is an absence of SIGNALLING. The
  quota was observed directly: a POST to /nlp/tokenize carrying the demo token published in
  InsightEra's own Swagger UI returned HTTP 403 with
  `{"message":"This token has no quota allowed on this service"}`. No RateLimit-*, X-RateLimit-*
  or Retry-After header is returned on any response, and HTTP 429 appears nowhere in the contract,
  so a client cannot discover its allowance, its remaining balance, or when it resets. It can only
  discover that it is out.
