- target: $
  description: The document declares no securityDefinitions even though every operation requires a token.
    Declare it so generated clients authenticate.
  update:
    securityDefinitions:
      token:
        type: apiKey
        name: token
        in: query
        description: Per-account service token issued by InsightEra. Note it travels in the query string,
          so it is exposed to logs and proxies.
    security:
    - token: []
